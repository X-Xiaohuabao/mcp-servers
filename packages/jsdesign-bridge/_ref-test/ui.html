<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; padding: 12px; font-size: 12px; color: #2B3440; }
  #status { margin-bottom: 8px; color: #58647C; }
  button { padding: 6px 14px; cursor: pointer; }
  #output { margin-top: 8px; max-height: 200px; overflow: auto; background: #F6F8FA;
            padding: 8px; white-space: pre-wrap; word-break: break-all; display: none; }
</style>
</head>
<body>
  <div id="status">阶段 1：本地导出模式（导出选中节点 JSON → 剪贴板）</div>
  <button id="export">导出选中节点</button>
  <pre id="output"></pre>
  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    // 点按钮 → 请求 code.js（画布沙箱）读取选中节点树
    document.getElementById('export').onclick = () => {
      statusEl.textContent = '导出中…';
      parent.postMessage({ pluginMessage: { type: 'export-selection' } }, '*');
    };

    // 接收 code.js 的序列化结果
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'export-result') {
        if (msg.error) {
          statusEl.textContent = '❌ ' + msg.error;
          return;
        }
        const json = JSON.stringify(msg.payload, null, 2);
        outputEl.style.display = 'block';
        outputEl.textContent = json;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(json)
            .then(() => { statusEl.textContent = '✅ 已导出并复制到剪贴板（' + msg.count + ' 个顶层节点）'; })
            .catch(() => { statusEl.textContent = '✅ 已导出（剪贴板不可用，请从下方文本框手动复制）'; });
        } else {
          statusEl.textContent = '✅ 已导出（请手动复制）';
        }
      }
    };
  </script>
</body>
</html>
